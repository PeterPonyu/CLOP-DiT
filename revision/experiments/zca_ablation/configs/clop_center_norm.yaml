# ZCA ablation — condition: center_norm (mean-center + L2 normalize, no decorrelation)
# Same as production except preprocessing method and save_dir.
# Points to a symlink cache so center_norm preprocessed files don't overwrite ZCA ones.

cache_dir: "data/cached_latents_ablation_centernorm"
use_preprocessed: true
use_deduplicated: true

seed: 42
variant_prob: 0.0
val_split: 0.1
n_folds: 1
fold_idx: 0
num_workers: 4
split_strategy: "stratified"

# Model
text_dim: 1024
cell_dim: 512
proj_dim: 512
text_layers: 3
cell_layers: 3
dropout: 0.2
temperature: 14.0
temperature_init: 14.0
temperature_learnable: false
label_smoothing: 0.1
use_batch_norm: false
use_ema: false
cell_noise_std: 0.0
use_whitening: false

# Loss
loss_type: "prototype_siglip"
auto_duplicate_mask: true
cohesion_weight: 0.15
max_temperature: 16.0
temp_reg_weight: 0.0
separation_margin: 0.2
separation_threshold: 0.2

# Training
batch_size: 1024
lr: 5.0e-4
weight_decay: 0.06
num_epochs: 100
warmup_epochs: 5
grad_clip: 1.0
use_amp: true
early_stopping_patience: 0
temp_lr_multiplier: 0.0
mixup_alpha: 0.2

# Temperature schedule
temp_schedule: "none"
temp_schedule_max: 20.0
temp_schedule_min: 10.0

# Group-aware sampling
group_aware_sampling: true
groups_per_batch: 64
hard_negative_ratio: 0.6
hard_negative_k: 10
class_weight_power: 0.5

# Preprocessing — center + L2 normalize only (no ZCA decorrelation)
preprocess_text_method: "center_norm"
preprocess_cell_method: "center_norm"

device: "cuda"
save_dir: "models/revision/zca_ablation/center_norm"
