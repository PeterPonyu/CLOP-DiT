# Family taxonomy for the 69 evaluation cell types.
#
# Families are chosen to group cell types by well-established lineage /
# developmental / functional proximity, so that a KNN error within a
# family is "graceful degradation" (closely related cell types are
# easy to confuse) while a cross-family error is "catastrophic"
# (e.g. a T cell called an epithelial cell).
#
# Group-id assignments are grounded in canonical markers from
# text_caption_metadata.json and the short names from
# text_captions_deduplicated.json. The taxonomy is intentionally
# conservative: when a type straddles two families, we assign it to
# the family whose markers dominate its caption. Borderline calls are
# flagged in comments.

lymphoid:
  - 0    # CD8+ cytotoxic T lymphocytes
  - 6    # CD4+ helper T lymphocytes
  - 9    # Natural killer (NK) cells
  - 11   # B lymphocytes
  - 14   # CD4+FOXP3+ regulatory T cells (Tregs)
  - 20   # Antibody-secreting plasma cells
  - 37   # Exhausted T cells

myeloid:
  - 1    # MHC-II-high antigen-presenting cells
  - 5    # Tissue-resident macrophages
  - 7    # Circulating monocytes
  - 10   # Neutrophils
  - 23   # Microglia
  - 48   # Plasmacytoid dendritic cells (pDCs)
  - 60   # Conventional dendritic cells

mast_and_isg:
  - 16   # Interferon-stimulated cells
  - 54   # Mast cells

erythroid_and_hspc:
  - 13   # Erythroid lineage cells
  - 31   # Mature red blood cells (erythrocytes)
  - 34   # Hematopoietic stem and progenitor cells (HSPC)
  - 51   # Megakaryocytes

epithelial:
  - 8    # Generic epithelial cells
  - 12   # Alveolar type 2 (AT2) pneumocytes
  - 15   # Cholangiocytes and bile duct epithelial cells
  - 25   # Mucus-secreting goblet cells
  - 28   # Prostate luminal epithelial cells
  - 33   # Urothelial (transitional) epithelial cells
  - 39   # Alveolar type 1 (AT1) pneumocytes
  - 41   # Luminal epithelial cells
  - 42   # Basal epithelial cells
  - 43   # Club (Clara) secretory cells
  - 52   # Multiciliated epithelial cells
  - 66   # Myoepithelial and basal cells
  - 68   # Kidney proximal tubule cells

endothelial:
  - 19   # Vascular endothelial cells
  - 24   # Tip and angiogenic endothelial cells
  - 30   # Venous endothelial cells
  - 36   # Capillary endothelial cells
  - 53   # Lymphatic endothelial cells

mesenchymal:
  - 3    # Fibroblasts and mesenchymal stromal cells
  - 18   # Smooth muscle cells
  - 63   # Mesenchymal stem and stromal cells (MSCs)
  - 67   # Pericytes and mural cells

neural_and_glial:
  - 22   # Radial glial and neural progenitor cells
  - 29   # Müller glial cells
  - 32   # Excitatory glutamatergic neurons
  - 35   # Astrocytes
  - 40   # Hippocampal dentate gyrus granule cells
  - 44   # Spinal cord interneurons
  - 46   # Inhibitory GABAergic neurons
  - 47   # Retinal ganglion cells
  - 49   # Oligodendrocytes
  - 50   # Intermediate neural progenitors (INPs)
  - 57   # Lower motor neurons
  - 58   # Oligodendrocyte precursor cells (OPCs)
  - 59   # Dorsal horn sensory neurons

parenchymal_secretory:
  - 21   # Merkel cells (neuroendocrine skin; could argue for neural)
  - 26   # Hepatocytes
  - 27   # Pancreatic beta cells
  - 38   # Pancreatic alpha cells
  - 55   # Neuroendocrine cells
  - 56   # Melanocytes
  - 61   # Pancreatic delta cells
  - 62   # Pituitary gonadotroph cells
  - 64   # Ameloblasts
  - 65   # Pituitary thyrotroph cells

proliferation_stress_pluripotent:
  - 2    # Heat-shock and stress response cells
  - 4    # Actively cycling cells in S/G2/M phase
  - 17   # Actively proliferating cells
  - 45   # Pluripotent stem cells (embryonic stem cells)
