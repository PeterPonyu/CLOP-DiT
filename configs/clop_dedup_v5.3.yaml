# CLOP Configuration v5.3 — Deduplicated Data Pipeline
# ============================================================
#
# This configuration uses the deduplicated and filtered caption dataset:
# - Uncharacterized cells removed (53,059 cells filtered)
# - 1,088 redundant captions consolidated to 69 core cell types
# - Total cells: 167,245 (down from 220,304)
#
# Expected improvements:
#   - Validation accuracy: 1-3% → 8-15% (4-5x improvement)
#   - Training stability: reduced noise from label conflicts
#   - Generalization: clearer cell type signal
#
# Based on v6.3 architecture with enhancements:
#   1. Improved data quality (deduplication)
#   2. Better temperature regularization (prevents saturation)
#   3. Group-aware sampling for balanced gradients
#   4. Dataset-level cross-validation (prevents leakage)

# Data — uses deduplicated embeddings
cache_dir: "data/cached_latents_v5.2"
use_deduplicated: true           # Load deduplicated captions + filtered cells
use_preprocessed: false         # Dedup pipeline uses its own files; whitened
                                  # preprocessed files (.npy) are for the original
                                  # 1088-sub-cluster path and must NOT be used here.
                                  # Cell embeddings: cell_embeddings_dedup.npy (raw scGPT)
                                  # Text embeddings: text_embeddings_dedup.npy (L2-normalized)
variant_prob: 0.0               # Disabled with deduplicated captions (redundant)
val_split: 0.1
n_folds: 1
fold_idx: 0
num_workers: 4

# Model
text_dim: 1024         # BiomedBERT-large output (1024-dim)
cell_dim: 512          # scGPT output (512-dim)
proj_dim: 512          # Shared projection space dimension
text_layers: 3         # MLP depth for text projector
cell_layers: 3         # MLP depth for cell projector
dropout: 0.2           # Regularization for both projectors
temperature: 14.0      # Initial logit_scale (CLIP standard)
label_smoothing: 0.1   # Only used if loss_type=infonce
use_batch_norm: false  # LayerNorm preferred for cross-dataset generalization
use_ema: false         # Exponential moving average (disabled for simplicity)
cell_noise_std: 0.05   # Gaussian noise on cell embeddings during training

# Loss & Regularization
loss_type: "prototype_siglip"   # Aligns text to cell group centroids
auto_duplicate_mask: true       # Mask identical-text cells in same batch
cohesion_weight: 0.1            # Prototype cohesion regularization
max_temperature: 20.0           # Temperature upper bound (prevents overfitting)
temp_reg_weight: 0.01           # L2 penalty on log_temperature (NEW: prevents saturation)

# Training
batch_size: 1024       # Needed for meaningful prototype averaging (>0 collisions)
lr: 1.0e-3             # Learning rate for projectors
weight_decay: 0.05     # L2 regularization strength
num_epochs: 150        # Shorter (data is cleaner now)
warmup_epochs: 10      # Learning rate warmup
grad_clip: 1.0         # Gradient clipping norm
use_amp: true          # Automatic mixed precision
early_stopping_patience: 25   # Stop if no improvement for 25 epochs

# Advanced sampling (recommended for balanced groups)
group_aware_sampling: true      # Sample cells to ensure groups per batch
groups_per_batch: 64            # Target unique text groups per batch
hard_negative_ratio: 0.5        # Fraction of hard negatives in batch
hard_negative_k: 20             # Top-K hard negatives to consider

# Embedding preprocessing
preprocess_text_method: "whiten"
preprocess_cell_method: "whiten"

# scGPT configuration
scgpt_model_dir: "models/scgpt_pancancer"

# System
device: "cuda"
save_dir: "models/checkpoints"
log_level: "INFO"

# Checkpoint configuration
# Save periodically and track best model by validation accuracy

