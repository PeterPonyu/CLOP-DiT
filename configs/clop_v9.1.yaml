# clop_v9.1.yaml — Refined: prevent temperature runaway & overfitting
#
# v9 BASELINE findings (on properly preprocessed dedup data):
#   ✓ Train proto reaches 100% by epoch 6 (vs 15% on broken data!)
#   ✓ Val proto peaks ~44% around epoch 10-15 (vs 5% on broken data)
#   ✗ Temperature climbs 14 → 30 (ceiling) causing:
#     - text-cell alignment (t↔c) collapses: 0.47 → -0.01
#     - val proto slowly degrades after peak
#     - alignment metric worsens: 1.1 → 1.95
#   The model overfits via logit sharpening rather than learning
#   generalizable text-cell correspondence.
#
# v9.1 REFINEMENTS:
#   1. max_temperature: 30 → 16 (prevent sharpening past useful range)
#   2. temp_reg_weight: 0 → 0.01 (L2 penalty on log_temperature)
#   3. dropout: 0.15 → 0.3 (more regularization)
#   4. weight_decay: 0.05 → 0.1 (more L2 regularization)
#   5. cell_noise_std: 0.02 → 0.05 (stronger augmentation)
#   6. num_epochs: 120 → 60 (training saturates by epoch 10)
#   7. cohesion_weight: 0.1 → 0.2 (tighter intra-type clusters)
#   8. temp_lr_multiplier: 5.0 → 1.0 (slow temperature adaptation)

cache_dir: "data/cached_latents_v5.2"
use_preprocessed: true
use_deduplicated: true

variant_prob: 0.0
val_split: 0.1
n_folds: 1
fold_idx: 0
num_workers: 4

# Model — same architecture, more regularization
text_dim: 1024
cell_dim: 512
proj_dim: 512
text_layers: 3
cell_layers: 3
dropout: 0.3                    # ↑ from 0.15: prevent memorization
temperature: 14.0
temperature_init: 14.0
temperature_learnable: true
label_smoothing: 0.1
use_batch_norm: false
use_ema: false
cell_noise_std: 0.05            # ↑ from 0.02: stronger cell augmentation
use_whitening: false

# Loss — controlled temperature + stronger regularization
loss_type: "prototype_siglip"
auto_duplicate_mask: true
cohesion_weight: 0.2            # ↑ from 0.1: tighter clusters in projection
max_temperature: 16.0           # ↓↓ from 30.0: prevent logit sharpening
temp_reg_weight: 0.01           # NEW: L2 penalty on temperature growth

# Training — shorter, more regularized
batch_size: 1024
lr: 5.0e-4
weight_decay: 0.1               # ↑ from 0.05: more L2 reg
num_epochs: 60                  # ↓ from 120: training saturates early
warmup_epochs: 5                # ↓ from 10: reach useful LR faster
grad_clip: 1.0
use_amp: true
early_stopping_patience: 0
temp_lr_multiplier: 1.0         # ↓ from 5.0: slow temperature adaptation

# Preprocessing
preprocess_text_method: "whiten"
preprocess_cell_method: "whiten"

device: "cuda"
save_dir: "models/checkpoints"
