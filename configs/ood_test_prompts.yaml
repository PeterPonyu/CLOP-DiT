# Out-of-distribution test prompts for OOD evaluation of CLOP-DiT.
#
# Three categories:
#   1. novel_cell_types  -- cell types not represented in the training set
#   2. free_form_text    -- unstructured, informal descriptions (no template)
#   3. cross_tissue      -- known cell types placed in biologically unusual tissue contexts

novel_cell_types:
  - name: "Goblet cells"
    prompt: "Mucus-secreting goblet cells from human intestinal epithelium. These specialized secretory cells produce and release gel-forming mucins that form the protective mucus layer of the gastrointestinal tract, expressing MUC2, TFF3, and FCGBP."
    category: "novel_type"

  - name: "Purkinje cells"
    prompt: "Purkinje neurons from human cerebellar cortex. Large GABAergic inhibitory neurons in the Purkinje layer of the cerebellum, characterized by extensive dendritic arbors and expression of CALB1, PCP2, and ITPR1."
    category: "novel_type"

  - name: "Podocytes"
    prompt: "Glomerular podocytes from human kidney. Highly specialized epithelial cells wrapping the capillaries of the renal glomerulus, forming the slit diaphragm filtration barrier and expressing NPHS1, NPHS2, WT1, and PODXL."
    category: "novel_type"

  - name: "Leydig cells"
    prompt: "Interstitial Leydig cells from human testis. Steroidogenic cells located in the interstitial compartment between seminiferous tubules, responsible for testosterone biosynthesis and expressing STAR, CYP11A1, and HSD3B2."
    category: "novel_type"

  - name: "Club cells"
    prompt: "Non-ciliated bronchiolar club cells (formerly Clara cells) from human distal airways. Secretory epithelial cells expressing SCGB1A1 and CYP2F1, contributing to airway surface liquid and xenobiotic metabolism in the terminal bronchioles."
    category: "novel_type"

  - name: "Merkel cells"
    prompt: "Merkel cells from human skin epidermis. Neuroendocrine mechanoreceptor cells in the basal layer of the epidermis, associated with light-touch sensation and expressing KRT20, ATOH1, and ISL1."
    category: "novel_type"

free_form_text:
  - name: "informal_cd8"
    prompt: "immune cells that kill infected cells in the lung"
    category: "free_form"

  - name: "informal_macrophage"
    prompt: "the big cells that eat bacteria and dead cells in inflamed tissue"
    category: "free_form"

  - name: "informal_stem"
    prompt: "undifferentiated cells that can become many different cell types in the bone marrow"
    category: "free_form"

  - name: "informal_neuron"
    prompt: "brain cells that fire electrical signals and talk to each other with chemicals"
    category: "free_form"

  - name: "verbose_treg"
    prompt: "I am looking for a type of T cell that suppresses immune responses rather than promoting them. They are often found in tumors and express FOXP3 and CD25. Sometimes called regulatory T cells."
    category: "free_form"

  - name: "question_style"
    prompt: "what would a fibroblast in a wound healing context look like at the single-cell level"
    category: "free_form"

  - name: "shorthand_nk"
    prompt: "NK cells, cytotoxic, blood"
    category: "free_form"

  - name: "clinical_note_style"
    prompt: "Patient sample shows atypical large B-cells consistent with diffuse large B-cell lymphoma, germinal center subtype"
    category: "free_form"

cross_tissue:
  - name: "hepatocytes_in_lung"
    prompt: "Hepatocyte-like cells found in human lung tissue. Ectopic cells expressing albumin, AFP, and hepatocyte nuclear factors detected in pulmonary parenchyma, potentially arising from transdifferentiation or metaplasia."
    category: "cross_tissue"

  - name: "neurons_in_gut"
    prompt: "Enteric neurons from the human intestinal wall. Neuronal cell bodies of the myenteric plexus embedded in the gut muscularis, forming the enteric nervous system and expressing ELAVL4, PHOX2B, and RET."
    category: "cross_tissue"

  - name: "cardiomyocytes_in_brain"
    prompt: "Cardiomyocyte-like cells detected in human brain tissue. Cells expressing cardiac-specific markers MYH7, TNNT2, and ACTC1 found ectopically within the central nervous system parenchyma."
    category: "cross_tissue"

  - name: "melanocytes_in_liver"
    prompt: "Melanocyte-lineage cells in human liver biopsy. Pigment-producing cells expressing MITF, TYR, and PMEL found within hepatic sinusoids, suggesting metastatic dissemination from a cutaneous primary."
    category: "cross_tissue"

  - name: "osteoclasts_in_thyroid"
    prompt: "Multinucleated osteoclast-like giant cells in human thyroid tissue. TRAP-positive cells expressing CTSK, ACP5, and MMP9 found in thyroid stroma, associated with papillary thyroid carcinoma."
    category: "cross_tissue"

  - name: "pancreatic_beta_in_spleen"
    prompt: "Insulin-producing beta-cell-like cells in human spleen. Endocrine cells expressing INS, PDX1, and NKX6-1 detected in splenic tissue, potentially from ectopic pancreatic rests or engineered cell transplants."
    category: "cross_tissue"
