# clop_v8.2 — Comprehensive improvements over v8.1
# Generated on 2026-03-03
#
# Changes vs v8.1:
#   1. Caption variant augmentation (variant_prob=0.3, 4586 variants generated)
#   2. Temperature cap raised: 20 → 50 (allow sharper discrimination)
#   3. Embedding MixUp (alpha=0.2) for within-group regularization
#   4. R-Drop consistency regularization (weight=0.1)
#   5. Stronger cell noise: 0.1 → 0.15
#   6. Label smoothing: 0.1 → 0.12
#   7. 120 epochs (matches v8.1 re-run, no epoch conflict)
#
# Data path: v6.2 (1088 sub-clusters, 220K cells, preprocessed/whitened)
# Loss: prototype_siglip with cohesion regularization
#
# Previous results for reference:
#   v6.4.1: best_val_proto_acc = 10.45%, gap = 3.5x (BEST to beat)
#   v8.1:   best_val_proto_acc =  8.88%, gap = 3.9x (regressed)

cache_dir: "data/cached_latents_v5.2"
use_preprocessed: true

# Caption variant augmentation (NEW in v8.2)
variant_prob: 0.3           # 30% chance of using a variant caption per sample
# variant files auto-detected from cache_dir:
#   text_variant_embeddings.npy (4586, 1024)
#   text_variant_map.json

val_split: 0.1
n_folds: 1
fold_idx: 0
num_workers: 4

# Model architecture (same as v8.1)
text_dim: 1024
cell_dim: 512
text_encoder_path: "microsoft/BiomedNLP-BiomedBERT-large-uncased-abstract"
proj_dim: 512
text_layers: 3
cell_layers: 3
dropout: 0.3
temperature: 14.0
temperature_init: 14.0
temperature_learnable: true
label_smoothing: 0.12       # slightly higher (was 0.1)
use_batch_norm: false
use_ema: false
cell_noise_std: 0.15        # stronger (was 0.1 in v8.1, 0.05 in v6.3)

# Loss
loss_type: "prototype_siglip"
auto_duplicate_mask: true
cohesion_weight: 0.2
max_temperature: 50.0       # raised from 20.0 to allow sharper discrimination

# Regularization (NEW in v8.2)
mixup_alpha: 0.2            # embedding-level MixUp within groups
rdrop_weight: 0.1           # R-Drop consistency loss between two forward passes

# Training
batch_size: 1024
lr: 5.0e-4
weight_decay: 0.08
num_epochs: 120
warmup_epochs: 10
grad_clip: 1.0
use_amp: true
early_stopping_patience: 0    # DISABLED — temperature trough lasts ~40 epochs; let full 120 run
temp_lr_multiplier: 5.0

# Preprocessing
preprocess_text_method: "whiten"
preprocess_cell_method: "whiten"

# System
scgpt_model_dir: "models/scgpt_pancancer"
device: "cuda"
save_dir: "models/checkpoints"
run_name: "clop_v8.2"
log_file: "logs/v8.2_train.log"
