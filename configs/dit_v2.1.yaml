# DiT Configuration — v2.1 (matched to CLOP v9.4)
# 1D Diffusion Transformer with Flow Matching
#
# Key changes from v2.0:
#   - num_epochs: 200 → 300 (DiT still improving at epoch 200)
#   - eval_interval: 50 → 25 (more frequent generation quality tracking)
#   - variance_loss_weight: confirmed 0.1 (addresses Fig 24 variance compression)
#   - inference_steps: 20 → 30 (higher quality for evaluation)
#
# Targets: Improve Figs 3, 5, 22, 24

# Data
cache_dir: "data/cached_latents_v5.2"
projected_text_path: "data/cached_latents_v5.2/projected_text.npy"
use_deduplicated: true
use_preprocessed: true
seed: 42
split_strategy: "stratified"
val_split: 0.1
n_folds: 1
fold_idx: 0
num_workers: 4

# Model Architecture (unchanged from v2.0)
latent_dim: 512
hidden_dim: 512
cond_dim: 512
num_blocks: 8
num_heads: 8
mlp_ratio: 4.0
num_tokens: 16
cond_drop_prob: 0.15
attn_drop: 0.0
proj_drop: 0.1

# Training
batch_size: 1024
lr: 2.0e-4
weight_decay: 0.01
num_epochs: 300                    # CHANGED: was 200 — extend to full convergence
warmup_epochs: 5
grad_clip: 1.0
use_amp: true
ema_decay: 0.9999
log_interval: 100
eval_interval: 25                  # CHANGED: was 50 — more frequent quality tracking

# Time sampling
time_sampling: "logit_normal"
time_sampling_mean: 0.0
time_sampling_std: 1.0

# Inference
inference_steps: 30                # CHANGED: was 20 — higher quality evaluation
cfg_scale: 3.0

# Variance-matching regularization
variance_loss_weight: 0.1

# Adaptive ODE solver
adaptive_solver: false
adaptive_solver_atol: 1.0e-5
adaptive_solver_rtol: 1.0e-5

# scGPT
scgpt_model_dir: "models/scgpt_pancancer"

# System
device: "cuda"
save_dir: "models/checkpoints"
