# clop_v9.4.yaml — Extended training, no cell noise, class-weighted sampling
#
# Key changes from v9.3:
#   - num_epochs: 60 → 100 (training hadn't fully plateaued)
#   - cell_noise_std: 0.03 → 0.0 (ablation Fig 21: removing noise → +13% proto_acc)
#   - mixup_alpha: 0.0 → 0.2 (within-group embedding mixing for regularization)
#   - group_aware_sampling: true with class_weight_power=0.5 (sqrt-balanced rare types)
#   - hard_negative_ratio: 0.5 → 0.6 (more confusable pair exposure)
#
# Targets: Improve Figs 3, 5, 6, 7, 25, 26, 28

cache_dir: "data/cached_latents_v5.2"
use_preprocessed: true
use_deduplicated: true

seed: 42
variant_prob: 0.0
val_split: 0.1
n_folds: 1
fold_idx: 0
num_workers: 4
split_strategy: "stratified"

# Model — fixed temperature, reduced regularization
text_dim: 1024
cell_dim: 512
proj_dim: 512
text_layers: 3
cell_layers: 3
dropout: 0.2
temperature: 14.0
temperature_init: 14.0
temperature_learnable: false
label_smoothing: 0.1
use_batch_norm: false
use_ema: false
cell_noise_std: 0.0               # CHANGED: was 0.03 — ablation shows noise hurts
use_whitening: false

# Loss
loss_type: "prototype_siglip"
auto_duplicate_mask: true
cohesion_weight: 0.15
max_temperature: 16.0
temp_reg_weight: 0.0
separation_margin: 0.1             # NEW: push confusable prototypes apart
separation_threshold: 0.3          # NEW: penalize prototype pairs with cosine > 0.3

# Training
batch_size: 1024
lr: 5.0e-4
weight_decay: 0.06
num_epochs: 100                    # CHANGED: was 60 — extend to full convergence
warmup_epochs: 5
grad_clip: 1.0
use_amp: true
early_stopping_patience: 0
temp_lr_multiplier: 0.0
mixup_alpha: 0.2                   # CHANGED: was 0.0 — within-group mixing

# Temperature schedule
temp_schedule: "none"
temp_schedule_max: 20.0
temp_schedule_min: 10.0

# Group-aware sampling
group_aware_sampling: true         # CHANGED: was false/unset
groups_per_batch: 64               # All 69 types → most in each batch
hard_negative_ratio: 0.6           # CHANGED: was 0.5 — more confusable pair exposure
hard_negative_k: 10
class_weight_power: 0.5            # NEW: sqrt-balanced rare type upsampling

# Preprocessing
preprocess_text_method: "whiten"
preprocess_cell_method: "whiten"

device: "cuda"
save_dir: "models/checkpoints"
