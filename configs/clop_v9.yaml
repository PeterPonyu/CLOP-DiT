# clop_v9.yaml — Fixed preprocessing + embedding quality monitoring
# Generated on 2026-03-04
#
# CRITICAL FIX vs v8.x:
#   v8.x was training on RAW (collapsed) embeddings when use_deduplicated=True:
#     - cell cosine sim = 0.983 (extreme collapse, norms ≈ 21)
#     - text cosine sim = 0.958 (collapsed, norms = 1.0)
#   ZCA whitening was entirely bypassed in dedup mode.
#
#   v9 uses properly preprocessed dedup embeddings:
#     - cell cosine sim = 0.170 (well decorrelated, norms = 1.0)
#     - text cosine sim = -0.014 (perfectly decorrelated, norms = 1.0)
#
# Architecture changes vs v8.3:
#   - use_whitening: false (preprocessing done upstream, not in-model)
#   - temperature: 14.0 → 14.0 (keep CLIP standard, but now on proper data)
#   - dropout: 0.3 → 0.15 (less regularization needed with spread embeddings)
#   - cell_noise_std: 0.1 → 0.02 (unit-norm embeddings need less noise)
#   - cohesion_weight: 0.2 → 0.1 (prototypes more meaningful with spread data)
#   - max_temperature: 20.0 → 30.0 (allow more learning room)
#
# Monitoring: embedding quality metrics (alignment, uniformity, CLOP score,
# inter-type separation, conditioning fidelity) logged each epoch.
# Best model selected by composite quality score, not prototype accuracy.

# Data — preprocessed dedup embeddings
cache_dir: "data/cached_latents_v5.2"
use_preprocessed: true
use_deduplicated: true

# Caption variant augmentation
variant_prob: 0.0               # disabled for clean baseline

val_split: 0.1
n_folds: 1
fold_idx: 0
num_workers: 4

# Model architecture
text_dim: 1024
cell_dim: 512
proj_dim: 512
text_layers: 3
cell_layers: 3
dropout: 0.15                   # reduced: spread embeddings need less regularization
temperature: 14.0               # CLIP standard logit_scale
temperature_init: 14.0
temperature_learnable: true
label_smoothing: 0.1
use_batch_norm: false            # LayerNorm for cross-dataset generalization
use_ema: false
cell_noise_std: 0.02            # unit-norm embeddings == smaller noise scale
use_whitening: false             # preprocessing done upstream

# Loss
loss_type: "prototype_siglip"
auto_duplicate_mask: true
cohesion_weight: 0.1            # reduced: better-spread embeddings → cleaner prototypes
max_temperature: 30.0           # more headroom (was 20, saturated)

# Training
batch_size: 1024
lr: 5.0e-4
weight_decay: 0.05              # reduced from 0.08 (less regularization needed)
num_epochs: 120
warmup_epochs: 10
grad_clip: 1.0
use_amp: true
early_stopping_patience: 0
temp_lr_multiplier: 5.0

# Preprocessing
preprocess_text_method: "whiten"
preprocess_cell_method: "whiten"

# System
device: "cuda"
save_dir: "models/checkpoints"
