# clop_v8.1 — first run using v2 captions + variant augmentation
# Generated by Copilot agent on 2026-03-02
# Key changes vs v641: variant_prob 0→0.35, new embeddings, learnable temp

# CLOP Configuration — v6.4.1 (Capacity + regularization balance)
#
# v6.3: 87% train, 10.2% val proto_acc → 8.3x gap (overfitting)
# v6.4: 22.5% train, 5.5% val proto_acc → 4.1x gap (underfitting, 2 layers too few)
#
# v6.4.1 strategy: Restore 3-layer projector capacity (needed for learning)
#   but keep stronger regularization from v6.4 to prevent memorization.
#
# Changes from v6.3:
#   text_layers/cell_layers: 3 (KEEP — 2 layers underfits)
#   dropout: 0.2 → 0.3
#   cell_noise_std: 0.05 → 0.1
#   weight_decay: 0.05 → 0.08
#   lr: 1e-3 → 5e-4
#   cohesion_weight: 0.1 → 0.2
#   temp_lr_multiplier: 10 → 5

cache_dir: "data/cached_latents_v5.2"
use_preprocessed: true
variant_prob: 0.0            # disabled: variant files not yet generated
# variant_path: "data/cached_latents_v5.2/variants/text_variants.json"        # TODO: generate
# text_embeddings_path: "data/cached_latents_v5.2/embeddings/text_embeddings_v2.npy"  # TODO: generate
# text_strings_path: "data/cached_latents_v5.2/raw/text_strings_v2.json"      # TODO: generate
val_split: 0.1
n_folds: 1
fold_idx: 0
num_workers: 4

# Model — restore 3-layer capacity
text_dim: 1024
cell_dim: 512
text_encoder_path: "microsoft/BiomedNLP-BiomedBERT-large-uncased-abstract"
proj_dim: 512
text_layers: 3         # RESTORED from v6.4's 2
cell_layers: 3         # RESTORED from v6.4's 2
dropout: 0.3           # Stronger than v6.3 (0.2)
temperature: 14.0
temperature_init: 14.0
temperature_learnable: true
label_smoothing: 0.1
use_batch_norm: false
use_ema: false
cell_noise_std: 0.1    # 2x v6.3 (0.05), less aggressive than v6.4 (0.15)

# Loss
loss_type: "prototype_siglip"
auto_duplicate_mask: true
cohesion_weight: 0.2   # 2x v6.3 (0.1)
max_temperature: 20.0

# Training
batch_size: 1024
lr: 5.0e-4             # Half of v6.3 (1e-3)
weight_decay: 0.08     # Between v6.3 (0.05) and v6.4 (0.1)
num_epochs: 120          # was 200/80 conflict; use 120 comparable to v6.4.1's 132
# epochs: 80             # removed: conflicted with num_epochs
warmup_epochs: 10
grad_clip: 1.0
use_amp: true
early_stopping_patience: 30
temp_lr_multiplier: 5.0

# Preprocessing
preprocess_text_method: "whiten"
preprocess_cell_method: "whiten"

# System
scgpt_model_dir: "models/scgpt_pancancer"
device: "cuda"
save_dir: "models/checkpoints"
run_name: "clop_v8.1"
log_file: "logs/v8.1_train.log"
