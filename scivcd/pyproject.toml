[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scivcd"
version = "0.1.0"
description = "Scientific visualization conflict detection for matplotlib"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Visualization",
]

[project.scripts]
scivcd = "scivcd.cli:main"

[project.entry-points.pytest11]
scivcd = "scivcd.pytest_plugin"

[tool.setuptools.packages.find]
where = [".."]
include = ["scivcd*"]

[tool.scivcd]
# Default [tool.scivcd] config — project authors can override in their own pyproject.toml
disable = []

[tool.scivcd.thresholds]
gutter_hspace_max = 0.60
canvas_scale_floor_pt = 9.0
whitespace_content_min = 0.45
